      #     fi
      #   continue-on-error: true

      # - name: Upload Build Warnings
      #   if: ${{ steps.parse-new-build-warnings.outputs.build_log_exist == 'true' }}
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ${{ steps.build-log-setup.outputs.patch_hash }}-build-warnings
      #     path: ${{ steps.build-log-setup.outputs.build_warnings_directory }}
      #     retention-days: 90

    outputs:
      baseline_hash: ${{ inputs.baseline_hash }}
      evidence_artifact_id: ${{ steps.evidence.outputs.artifact-id }}
      summaries_artifact_id: ${{ steps.summaries.outputs.artifact-id }}
      current_logs_artifact_id: ${{ steps.current.outputs.artifact-id }}

  generate-issues:
    if: ${{ !cancelled() && inputs.build_only != 'true' }}
    needs: [compare-artifacts]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
    defaults:
      run:
        working-directory: riscv-gnu-toolchain
    steps:
      - uses: actions/checkout@v4

      - name: Setup env
        uses: ./.github/actions/common/setup-env
        with:
          free_up_space: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r ../requirements.txt --break-system-packages

      - name: Download summaries artifact
        id: summaries
        if: needs.compare-artifacts.outputs.summaries_artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.compare-artifacts.outputs.summaries_artifact_id }}
          merge-multiple: true
          path: ./riscv-gnu-toolchain/summaries

      - name: Download current logs artifact
        id: current
        if: needs.compare-artifacts.outputs.current_logs_artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.compare-artifacts.outputs.current_logs_artifact_id }}
          merge-multiple: true
          path: ./riscv-gnu-toolchain/current_logs

      - name: Download verified comparison
        id: evidence
        if: needs.compare-artifacts.outputs.evidence_artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.compare-artifacts.outputs.evidence_artifact_id }}
          merge-multiple: true
          path: ./riscv-gnu-toolchain/evidence

      - name: Link testsuite logs from this run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GCC_HASH: ${{ inputs.patch_applied_gcchash }}
        run: |
          : > debug-links.md
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.name, .id] | @tsv' > run-artifacts.tsv
          for target in linux-rv64gc_zba_zbb_zbc_zbs-lp64d linux-rv64gcv-lp64d newlib-rv64gcv-lp64d; do
            name="gcc-$target-$GCC_HASH-multilib-debug-output.log"
            id=$(awk -F '\t' -v name="$name" '$1 == name {print $2; exit}' run-artifacts.tsv)
            if [[ "$id" =~ ^[0-9]+$ ]]; then
              printf '%s testsuite logs: [zip](%s/%s/actions/runs/%s/artifacts/%s)\n' \
                "$target" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$id" >> debug-links.md
            fi
          done

      - name: Aggregate filtered results
        id: aggregate
        if: steps.summaries.outcome == 'success' && steps.current.outcome == 'success'
        continue-on-error: true
        env:
          GCC_HASH: ${{ inputs.patch_applied_gcchash }}
          PATCH_NAME: ${{ inputs.patch_name }}
        run: python ./scripts/aggregate.py -chash "$GCC_HASH" -patch "$PATCH_NAME" -o temp_comment.md

      - name: Determine testsuite verdict
        id: verdict
        env:
          COMPARISON_JOB: ${{ needs.compare-artifacts.result }}
          AGGREGATE_STEP: ${{ steps.aggregate.outcome }}
          EVIDENCE_STEP: ${{ steps.evidence.outcome }}
        run: python ../scripts/precommit_result.py

      - name: Trim comment length # reduce the number of lines in final comment so github always creates comment
        env:
          ADDITIONAL_INFO: ${{ inputs.additional_info }}
          EVIDENCE_ID: ${{ needs.compare-artifacts.outputs.evidence_artifact_id }}
        run: |
          # Max comment length is 65536. Allocate 1536 for extra statements
          head -c 64000 comment.md > trimmed_comment.md
          FILE_SIZE=$(stat -c%s "comment.md")
          if [ $FILE_SIZE -gt 64000 ]; then
            printf "\n\`\`\`\nComment text has been trimmed. The run artifacts contain the full comparison.\n" >> trimmed_comment.md
            # Max gist bytes are 1048576. Allocate 576 for extra statements
            ONE_MB_IN_BYTES=1048000
            if [ $FILE_SIZE -gt $ONE_MB_IN_BYTES ]; then
              printf "\nThe file was greater than 1 MB and has been trimmed to fit the gist limit. Please check logs for the untrimmed issue." > trimmed_comment_gist.md
            fi
            head -c $ONE_MB_IN_BYTES "comment.md" >> trimmed_comment_gist.md
            if [ $FILE_SIZE -gt $ONE_MB_IN_BYTES ]; then
              printf "\nThe file was greater than 1 MB and has been trimmed to fit the gist limit. Please check logs for the untrimmed issue." >> trimmed_comment_gist.md
            fi
          fi
          printf "\n### Testsuite download links\n\n" >> trimmed_comment.md
          if [[ "$EVIDENCE_ID" =~ ^[0-9]+$ ]]; then
            printf '[Complete comparison evidence](%s/%s/actions/runs/%s/artifacts/%s)\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$EVIDENCE_ID" >> trimmed_comment.md
          fi
          printf "Please check the Additional Information Build Targets section to see which testsuite log to look at. If you cannot download the artifacts or get a 404 error, you may need to sign in to github first.\n\n" >> trimmed_comment.md
          if [[ -f debug-links.md ]]; then cat debug-links.md >> trimmed_comment.md; fi
          echo "" >> trimmed_comment.md
          printf '\n[Additional information](%s)\n' "$ADDITIONAL_INFO" >> trimmed_comment.md

      - name: Create Unresolved Errors Comment Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_TITLE: ${{ inputs.issue_num }}_${{ inputs.patch_name }}_${{ inputs.patch_applied_gcchash }}_summary.md
        run: |
          if [ -e "trimmed_comment_gist.md" ]; then
            python3 ./scripts/create_gist.py --token "$GIST_TOKEN" --input trimmed_comment_gist.md --output comment_gist_url.txt --title "$GIST_TITLE"
            printf "\nGist URL: $(cat comment_gist_url.txt)" >> trimmed_comment.md
          fi
        continue-on-error: true

      - name: Update test report comment
        uses: peter-evans/create-or-update-comment@v4
        id: test-report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          comment-id: ${{ inputs.test_comment_id }}
          body-path: riscv-gnu-toolchain/trimmed_comment.md
          edit-mode: replace

      - name: Reconcile testsuite labels
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_num }}
          RESULT_LABELS: ${{ steps.verdict.outputs.labels }}
        with:
          script: |
            const params = {...context.repo, issue_number: Number(process.env.ISSUE_NUMBER)};
            const wanted = new Set(process.env.RESULT_LABELS.split(',').filter(Boolean));
            const current = new Set((await github.paginate(github.rest.issues.listLabelsOnIssue, params)).map(label => label.name));
            const additions = [...wanted].filter(label => !current.has(label));
            if (additions.length) await github.rest.issues.addLabels({...params, labels: additions});
            const managed = ['new-regressions', 'resolved-regressions', 'invalid', 'testsuite-failure'];
            // The build reporter also manages build-failure. Keep its evidence on an incomplete rerun.
            if (!wanted.has('invalid')) managed.push('build-failure');
            for (const name of managed) {
              if (current.has(name) && !wanted.has(name)) await github.rest.issues.removeLabel({...params, name});
            }

      # Adds comment which links issue to PR
      - name: Link Staging PR
        uses: actions/github-script@v7
        if: ${{ github.workflow == 'Staging' && github.event.pull_request }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ inputs.issue_num }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Pull request: ${{ github.event.pull_request.html_url }}'
            })

      - name: Publish testsuite verdict
        if: ${{ !cancelled() && github.workflow != 'Staging' && steps.test-report.outcome == 'success' && steps.verdict.outcome == 'success' }}
        env:
          STATE: ${{ steps.verdict.outputs.state }}
          DESCRIPTION: ${{ steps.verdict.outputs.description }}
          PATCHWORK_TOKEN: ${{ secrets.PATCHWORK_API }}
          TEST_REPORT: ${{ inputs.issue_num }}#issuecomment-${{ inputs.test_comment_id }}
        run: |
          python scripts/post_check_to_patchworks.py -event "$GITHUB_EVENT_NAME" -repo "$PRECOMMIT_REPOSITORY" -pid "$PATCH_ID" -desc "$DESCRIPTION" -iid "$TEST_REPORT" -state "$STATE" -context test -token "$PATCHWORK_TOKEN"
