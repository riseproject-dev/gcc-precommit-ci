name: Generate-Summary

on:
  workflow_call:
    inputs:
      patch_name:
        required: true
        type: string
      baseline_hash:
        required: true
        type: string
      patch_applied_gcchash:
        required: true
        type: string
      build_only:
        required: true
        type: string
      tot_hash:
        required: true
        type: string
      issue_num:
        required: true
        type: string
      build_comment_id:
        required: true
        type: string
      test_comment_id:
        required: true
        type: string
      additional_info:
        required: true
        type: string

env:
  PRECOMMIT_REPOSITORY: ${{ github.repository }}
  POSTCOMMIT_REPOSITORY: riseproject-dev/gcc-postcommit-ci
  POSTCOMMIT_TOKEN: ${{ secrets.RISE_CI_READ_TOKEN }}
  PATCHWORK_REPORTING_ENABLED: ${{ vars.PATCHWORK_REPORTING_ENABLED }}

jobs:
  compare-artifacts:
    if: ${{ always() && inputs.build_only != 'true' }} # ensure comparison always runs even on error
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      actions: read
      contents: read
      issues: read
    defaults:
      run:
        working-directory: riscv-gnu-toolchain
    steps:
      - uses: actions/checkout@v4

      - name: Setup env
        uses: ./.github/actions/common/setup-env
        with:
          free_up_space: false

      - name: Create directories
        run: |
          mkdir current_logs
          mkdir temp
          mkdir summaries

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r ../requirements.txt --break-system-packages

      - name: Download baseline sum files
        run: |
          if [ -z "${POSTCOMMIT_TOKEN}" ]; then
            echo "::error::RISE_CI_READ_TOKEN is required to read baseline artifacts from ${POSTCOMMIT_REPOSITORY}."
            exit 1
          fi
          # Download linux
          python ./scripts/download_artifact.py -name gcc-linux-rv64gcv-lp64d-${{ inputs.baseline_hash }}-multilib-sum-files -repo "${POSTCOMMIT_REPOSITORY}" -token "${POSTCOMMIT_TOKEN}" -outdir ./temp
          python ./scripts/download_artifact.py -name gcc-linux-rv64gc_zba_zbb_zbc_zbs-lp64d-${{ inputs.baseline_hash }}-non-multilib-sum-files -repo "${POSTCOMMIT_REPOSITORY}" -token "${POSTCOMMIT_TOKEN}" -outdir ./temp
          python ./scripts/download_artifact.py -name gcc-linux-rv32gc_zba_zbb_zbc_zbs-ilp32d-${{ inputs.baseline_hash }}-non-multilib-sum-files -repo "${POSTCOMMIT_REPOSITORY}" -token "${POSTCOMMIT_TOKEN}" -outdir ./temp
          # Download newlib
          python ./scripts/download_artifact.py -name gcc-newlib-rv64gcv-lp64d-${{ inputs.baseline_hash }}-multilib-sum-files -repo "${POSTCOMMIT_REPOSITORY}" -token "${POSTCOMMIT_TOKEN}" -outdir ./temp
          python ./scripts/download_artifact.py -name gcc-newlib-rv64gc-lp64d-${{ inputs.baseline_hash }}-non-multilib-sum-files -repo "${POSTCOMMIT_REPOSITORY}" -token "${POSTCOMMIT_TOKEN}" -outdir ./temp
          python ./scripts/download_artifact.py -name gcc-newlib-rv32gc-ilp32d-${{ inputs.baseline_hash }}-non-multilib-sum-files -repo "${POSTCOMMIT_REPOSITORY}" -token "${POSTCOMMIT_TOKEN}" -outdir ./temp
          python ./scripts/download_artifact.py -name gcc-newlib-rv64imc_zba_zbb_zbc_zbs-lp64d-${{ inputs.baseline_hash }}-multilib-sum-files -repo "${POSTCOMMIT_REPOSITORY}" -token "${POSTCOMMIT_TOKEN}" -outdir ./temp

      - name: Replace allowlist
        run: |
          rm -rf test/
          cp -r ../test/ .

      - name: Extract and parse baseline results
        run: |
          mkdir -p previous_logs
          for file in $(find ./temp -name "*.zip"); do
            unzip $file
            if grep -q "linux" <<< $file; then
              PARSE_EXISTING_REPORT="./scripts/testsuite-filter gcc glibc test/allowlist `find sum_files -name *.sum |paste -sd "," -`"
            else
              PARSE_EXISTING_REPORT="./scripts/testsuite-filter gcc newlib test/allowlist `find sum_files -name *.sum |paste -sd "," -`"
            fi
            ZIP_NAME=${file##*/}
            FILE_NAME=${ZIP_NAME%%-multilib*}
            echo $FILE_NAME
            $PARSE_EXISTING_REPORT | tee "previous_logs/$FILE_NAME-multilib-report.log"
            rm -rf sum_files
          done
          ls previous_logs

      - name: Separate multilib results
        run: |
          python scripts/separate_multilib_results.py -indir previous_logs -outdir previous_logs
          ls previous_logs
        continue-on-error: true

      # Download all current workflow artifacts

      - name: Print API usage info
        run: |
          curl \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/rate_limit

      - name: Download All targets
        uses: ./.github/actions/download-all-comparison-artifacts
        with:
          gcchash: ${{ inputs.patch_applied_gcchash }}
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ env.PRECOMMIT_REPOSITORY }}

      - name: Print API usage info
        run: |
          curl \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/rate_limit

      - name: Extract artifacts
        run: |
          ls ./temp/
          mkdir -p current_logs
          for f in $(ls ./temp/*report.zip); do
            unzip $f -d ./current_logs || true
          done
          ls current_logs

      - name: Separate multilib logs
        run: |
          python scripts/separate_multilib_results.py -indir current_logs -outdir current_logs
          mv current_logs/gcc-newlib-rv32imc_zba_zbb_zbc_zbs-ilp32-${{ inputs.patch_applied_gcchash }}-non-multilib-report.log current_logs/gcc-newlib-rv32imc_zba_zbb_zbc_zbs-ilp32-${{ inputs.patch_applied_gcchash }}-multilib-report.log
        continue-on-error: true

      - name: Compare artifacts
        run: |
          ls current_logs
          python ./scripts/compare_all_artifacts.py -hash ${{ inputs.patch_applied_gcchash }}

      - name: Search for build failures
        run: |
          python scripts/update_issue_status.py -token ${{ secrets.GITHUB_TOKEN }} -comment ${{ inputs.build_comment_id }} -repo "${PRECOMMIT_REPOSITORY}" -failure -baseline ${{ inputs.baseline_hash }}
          ls current_logs
        continue-on-error: true

      - name: Remove testsuite failures on build-only
        if: ${{ inputs.build_only == 'true' }}
        run: |
          rm current_logs/failed_testsuite.txt
        continue-on-error: true

      - name: Upload compare summaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.patch_applied_gcchash }}-summaries
          path: |
            riscv-gnu-toolchain/summaries
          retention-days: 90

      - name: Upload current log failures
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.patch_applied_gcchash }}-current-logs
          path: |
            riscv-gnu-toolchain/current_logs
          retention-days: 90

      - name: Upload baseline results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.patch_applied_gcchash }}-previous-logs
          path: |
            riscv-gnu-toolchain/previous_logs
          retention-days: 90

      # Compare build warnings
      - name: Download patches artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.patch_name }}-downloaded-patches
          path: ./riscv-gnu-toolchain/patches

      ################################################################################
      #    remove build log comparison stuff while we disable build-only runners     #
