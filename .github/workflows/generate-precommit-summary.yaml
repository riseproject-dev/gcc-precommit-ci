name: Generate-Summary

on:
  workflow_call:
    inputs:
      patch_id:
        required: true
        type: string
      patch_name:
        required: true
        type: string
      baseline_hash:
        required: true
        type: string
      patch_applied_gcchash:
        required: true
        type: string
      build_only:
        required: true
        type: string
      tot_hash:
        required: true
        type: string
      issue_num:
        required: true
        type: string
      build_comment_id:
        required: true
        type: string
      test_comment_id:
        required: true
        type: string
      additional_info:
        required: true
        type: string

env:
  PRECOMMIT_REPOSITORY: ${{ github.repository }}
  PATCH_ID: ${{ inputs.patch_id }}
  POSTCOMMIT_REPOSITORY: riseproject-dev/gcc-postcommit-ci
  PATCHWORK_REPORTING_ENABLED: >-
    ${{ (vars.PATCHWORK_REPORTING_ENABLED == 'true' ||
         (github.workflow == 'Patchworks' && github.event_name == 'workflow_dispatch' &&
          github.sha == vars.PATCHWORK_REPORTING_ENABLED)) && 'true' || 'false' }}

jobs:
  compare-artifacts:
    if: ${{ always() && inputs.build_only != 'true' }} # ensure comparison always runs even on error
    runs-on: ubuntu-24.04
    environment: production
    env:
      RESULT_SUFFIX: ${{ github.run_attempt > 1 && format('-attempt-{0}', github.run_attempt) || '' }}
    permissions:
      actions: read
      contents: read
      issues: read
    defaults:
      run:
        working-directory: riscv-gnu-toolchain
    steps:
      - uses: actions/checkout@v4

      - name: Setup env
        uses: ./.github/actions/common/setup-env
        with:
          free_up_space: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect post-commit baseline sums
        env:
          GH_TOKEN: ${{ secrets.RISE_CI_READ_TOKEN }}
          BASELINE: ${{ inputs.baseline_hash }}
        run: python ../scripts/prepare_test_comparison.py collect baseline "$BASELINE" --repo "$POSTCOMMIT_REPOSITORY"

      - name: Collect patch sums from this run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.patch_applied_gcchash }}
        run: python ../scripts/prepare_test_comparison.py collect candidate "$CANDIDATE" --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"

      - name: Compare matching boards with the pre-commit allowlist
        env:
          BASELINE: ${{ inputs.baseline_hash }}
          CANDIDATE: ${{ inputs.patch_applied_gcchash }}
        run: |
          mkdir -p summaries
          python ../scripts/prepare_test_comparison.py filter baseline "$BASELINE"
          python ../scripts/prepare_test_comparison.py filter candidate "$CANDIDATE"
          python scripts/compare_all_artifacts.py -hash "$CANDIDATE" --baseline-hash "$BASELINE"
          python scripts/precommit_evidence.py --baseline "$BASELINE" --candidate "$CANDIDATE" \
            --matrix ../configure-scripts/precommit-matrix.json --baseline-sums baseline-sums --candidate-sums candidate-sums

      - name: Archive comparison evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.patch_applied_gcchash }}-comparison-evidence${{ env.RESULT_SUFFIX }}
          path: riscv-gnu-toolchain/evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Install build status dependencies
        run: python -m pip install -r ../requirements.txt

      - name: Read build results
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ inputs.build_comment_id }}
          BASELINE: ${{ inputs.baseline_hash }}
        run: |
          python scripts/update_issue_status.py -token "$GH_TOKEN" -comment "$COMMENT_ID" -repo "$PRECOMMIT_REPOSITORY" -failure -baseline "$BASELINE"

      - name: Upload compare summaries
        id: summaries
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.patch_applied_gcchash }}-summaries${{ env.RESULT_SUFFIX }}
          path: riscv-gnu-toolchain/summaries
          retention-days: 90

      - name: Upload current log failures
        id: current
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.patch_applied_gcchash }}-current-logs${{ env.RESULT_SUFFIX }}
          path: riscv-gnu-toolchain/current_logs
          retention-days: 90

      - name: Upload baseline results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.patch_applied_gcchash }}-previous-logs${{ env.RESULT_SUFFIX }}
          path: riscv-gnu-toolchain/previous_logs
          retention-days: 90

      # Compare build warnings
