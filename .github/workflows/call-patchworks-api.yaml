name: Call-Patchworks-Api

on:
  issue_comment:
    types: [created]

env:
  PRECOMMIT_REPOSITORY: ${{ github.repository }}
  PATCHWORK_REPORTING_ENABLED: ${{ vars.PATCHWORK_REPORTING_ENABLED }}

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  get-patch-info:
    runs-on: ubuntu-24.04
    environment: production
    if: ${{ vars.PATCHWORK_REPORTING_ENABLED == 'true' && !github.event.issue.pull_request && (contains(github.event.comment.body, '/pass_') || contains(github.event.comment.body, '/warn_') || contains(github.event.comment.body, '/error_')) && contains(format(',{0},', vars.PATCHWORK_OVERRIDE_USERS), format(',{0},', github.actor)) }}
    defaults:
      run:
        working-directory: riscv-gnu-toolchain
    steps:
      - uses: actions/checkout@v4

      - name: Setup env
        uses: ./.github/actions/common/setup-env
        with:
          free_up_space: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r ../requirements.txt --break-system-packages

      - name: Get patch-name
        id: patch-name
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          PATCH_NAME=${ISSUE_TITLE##* }
          if [[ ! "$PATCH_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid patch artifact name: $PATCH_NAME" >&2
            exit 1
          fi
          echo "$PATCH_NAME"
          echo "patch_name=$PATCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Get check
        id: check
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          COMMAND=${COMMENT_BODY%%$'\n'*}
          if [[ ! "$COMMAND" =~ ^/(pass|warn|error)_(test|apply|build|lint)([[:space:]]|$) ]]; then
            echo "Unsupported Patchwork override command" >&2
            exit 1
          fi
          RESULT=${BASH_REMATCH[1]}
          CONTEXT=${BASH_REMATCH[2]}
          case "$CONTEXT" in
            test) CHECK=Testing ;;
            apply) CHECK=Apply; CONTEXT=apply-patch ;;
            build) CHECK=Build ;;
            lint) CHECK=Lint ;;
          esac
          echo "$CHECK"
          echo "$CONTEXT"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "check=$CHECK" >> "$GITHUB_OUTPUT"
          echo "context=$CONTEXT" >> "$GITHUB_OUTPUT"

      - name: Download patch
        run: |
          mkdir temp
          python ./scripts/download_artifact.py -name "${{ steps.patch-name.outputs.patch_name }}-downloaded-patches" -repo "${PRECOMMIT_REPOSITORY}" -token '${{ secrets.GITHUB_TOKEN }}' -outdir ./

      - name: Extract patch
        run: |
          unzip -o "${{ steps.patch-name.outputs.patch_name }}-downloaded-patches.zip"

      - name: Get patch id
        id: patch-id
        run: |
          PATCH_ID=$(tail -n 1 "./patches/${{ steps.patch-name.outputs.patch_name }}")
          if [[ ! "$PATCH_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid Patchwork patch id: $PATCH_ID" >&2
            exit 1
          fi
          echo "$PATCH_ID"
          echo "patch_id=$PATCH_ID" >> "$GITHUB_OUTPUT"

    outputs:
      patch_name: ${{ steps.patch-name.outputs.patch_name }}
      patch_id: ${{ steps.patch-id.outputs.patch_id }}
      check: ${{ steps.check.outputs.check }}
      context: ${{ steps.check.outputs.context }}
      result: ${{ steps.check.outputs.result }}

  report-pass:
    needs: [get-patch-info]
    if: ${{ needs.get-patch-info.outputs.result == 'pass' && vars.PATCHWORK_REPORTING_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: riscv-gnu-toolchain
    steps:
      - uses: actions/checkout@v4

      - name: Setup env
        uses: ./.github/actions/common/setup-env
        with:
          free_up_space: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r ../requirements.txt --break-system-packages

      - name: Report pass
        run: |
          if [[ '${{ needs.get-patch-info.outputs.check }}' == 'Apply' ]]; then DESC="Patch applied"; else DESC="${{ needs.get-patch-info.outputs.check }} passed"; fi
          python scripts/post_check_to_patchworks.py -event '${{ github.event_name }}' -repo "${PRECOMMIT_REPOSITORY}" -pid '${{ needs.get-patch-info.outputs.patch_id }}' -desc "$DESC" -iid '${{ github.event.issue.number }}' -state 'success' -context '${{ needs.get-patch-info.outputs.context }}' -token '${{ secrets.PATCHWORK_API }}'


  report-warn:
    needs: [get-patch-info]
    if: ${{ needs.get-patch-info.outputs.result == 'warn' && vars.PATCHWORK_REPORTING_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: riscv-gnu-toolchain
    steps:
      - uses: actions/checkout@v4

      - name: Setup env
        uses: ./.github/actions/common/setup-env
        with:
          free_up_space: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r ../requirements.txt --break-system-packages

      - name: Report Warning
        run: |
          python scripts/post_check_to_patchworks.py -event '${{ github.event_name }}' -repo "${PRECOMMIT_REPOSITORY}" -pid '${{ needs.get-patch-info.outputs.patch_id }}' -desc '${{ needs.get-patch-info.outputs.check }} warning' -iid '${{ github.event.issue.number }}' -state 'warning' -context '${{ needs.get-patch-info.outputs.context }}' -token '${{ secrets.PATCHWORK_API }}'


  report-error:
    needs: [get-patch-info]
    if: ${{ needs.get-patch-info.outputs.result == 'error' && vars.PATCHWORK_REPORTING_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: riscv-gnu-toolchain
    steps:
      - uses: actions/checkout@v4

      - name: Setup env
        uses: ./.github/actions/common/setup-env
        with:
          free_up_space: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r ../requirements.txt --break-system-packages

      - name: Report Error
        run: |
          if [[ '${{ needs.get-patch-info.outputs.check }}' == 'Apply' ]]; then DESC="Patch failed to apply"; else DESC="${{ needs.get-patch-info.outputs.check }} failed"; fi
          python scripts/post_check_to_patchworks.py -event '${{ github.event_name }}' -repo "${PRECOMMIT_REPOSITORY}" -pid '${{ needs.get-patch-info.outputs.patch_id }}' -desc "$DESC" -iid '${{ github.event.issue.number }}' -state 'fail' -context '${{ needs.get-patch-info.outputs.context }}' -token '${{ secrets.PATCHWORK_API }}'
