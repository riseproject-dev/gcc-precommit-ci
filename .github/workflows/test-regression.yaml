name: Test-Regression

on:
  workflow_call:
    secrets:
      PATCHWORK_API:
        required: false
      GIST_TOKEN:
        required: false
    inputs:
      patch_name:
        required: true
        type: string
      patch_id:
        required: true
        type: string
      mode:
        required: true
        type: string
      target:
        required: true
        type: string
      baseline_hash:
        required: true
        type: string
      patch_applied_gcchash:
        required: true
        type: string
      multilib:
        required: true
        type: string
      build_only:
        required: true
        type: string
      issue_num:
        required: true
        type: string
      build_comment_id:
        required: true
        type: string
      test_comment_id:
        required: true
        type: string
      run_on_self_hosted:
        required: true
        type: boolean
      tot_hash:
        required: true
        type: string
      additional_info:
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  PRECOMMIT_REPOSITORY: ${{ github.repository }}
  PATCHWORK_REPORTING_ENABLED: ${{ vars.PATCHWORK_REPORTING_ENABLED }}

jobs:
  report-queued:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Validate the Patchwork target
        env:
          PATCH_ID: ${{ inputs.patch_id }}
        run: '[[ "$PATCH_ID" =~ ^[0-9]+$ ]]'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Mark build queued
        working-directory: riscv-gnu-toolchain
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ inputs.build_comment_id }}
          TARGET: ${{ inputs.mode }}-${{ inputs.target }}-${{ inputs.multilib }}
          GCC_HASH: ${{ inputs.build_only == 'true' && inputs.tot_hash || inputs.baseline_hash }}
          INFO_URL: ${{ inputs.additional_info }}
        run: |
          python scripts/update_issue_status.py -token "$GH_TOKEN" -state 'Queued' -comment "$COMMENT_ID" -target "$TARGET" -check 'Build GCC' -repo "$GITHUB_REPOSITORY" -baseline "$GCC_HASH"
          printf '\n[Additional information](%s)\n' "$INFO_URL" >> comment.md

      - uses: ./.github/actions/update-comment
        with:
          comment_id: ${{ inputs.build_comment_id }}
          file_path: riscv-gnu-toolchain/comment.md
          token: ${{ github.token }}

      - name: Report queued Patchwork checks
        if: ${{ github.workflow != 'Staging' }}
        working-directory: riscv-gnu-toolchain
        env:
          PATCHWORK_TOKEN: ${{ secrets.PATCHWORK_API }}
          PATCH_ID: ${{ inputs.patch_id }}
          TARGET: ${{ inputs.mode }}-${{ inputs.target }}-${{ inputs.multilib }}
          BUILD_ISSUE: ${{ inputs.issue_num }}#issuecomment-${{ inputs.build_comment_id }}
          TEST_ISSUE: ${{ inputs.issue_num }}#issuecomment-${{ inputs.test_comment_id }}
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          python scripts/post_check_to_patchworks.py -event "$GITHUB_EVENT_NAME" -repo "$GITHUB_REPOSITORY" -pid "$PATCH_ID" -desc 'Build queued' -iid "$BUILD_ISSUE" -state pending -context "build--$TARGET" -token "$PATCHWORK_TOKEN"
          if [[ "$BUILD_ONLY" == false ]]; then
            python scripts/post_check_to_patchworks.py -event "$GITHUB_EVENT_NAME" -repo "$GITHUB_REPOSITORY" -pid "$PATCH_ID" -desc 'Testsuite queued' -iid "$TEST_ISSUE" -state pending -context test -token "$PATCHWORK_TOKEN"
          fi

  execute:
    needs: [report-queued]
    uses: ./.github/workflows/regression-worker.yaml
    cache-mode: none
    permissions:
      actions: read
      contents: read
    with:
      patch_name: ${{ inputs.patch_name }}
      patch_id: ${{ inputs.patch_id }}
      mode: ${{ inputs.mode }}
      target: ${{ inputs.target }}
      baseline_hash: ${{ inputs.baseline_hash }}
      patch_applied_gcchash: ${{ inputs.patch_applied_gcchash }}
      multilib: ${{ inputs.multilib }}
      build_only: ${{ inputs.build_only }}
      run_on_self_hosted: ${{ inputs.run_on_self_hosted }}
      tot_hash: ${{ inputs.tot_hash }}

  report-complete:
    needs: [report-queued, execute]
    if: ${{ !cancelled() && needs.report-queued.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Report build completion status
        uses: ./.github/actions/report-build-complete-status
        with:
          build_status: ${{ needs.execute.outputs.build_status == 'success' && 'success' || 'failure' }}
          patch_id: ${{ inputs.patch_id }}
          patch_name: ${{ inputs.patch_name }}
          build_log_name: ${{ inputs.patch_id }}-${{ inputs.mode }}-${{ inputs.target }}-${{ inputs.multilib }}-build-log
          target: ${{ inputs.mode }}-${{ inputs.target }}-${{ inputs.multilib }}
          baseline_hash: ${{ inputs.baseline_hash }}
          tot_hash: ${{ inputs.tot_hash }}
          build_only: ${{ inputs.build_only }}
          issue_num: ${{ inputs.issue_num }}
          build_comment_id: ${{ inputs.build_comment_id }}
          additional_info: ${{ inputs.additional_info }}
          github_token: ${{ github.token }}
          gist_token: ${{ secrets.GIST_TOKEN }}
          patchwork_token: ${{ secrets.PATCHWORK_API }}
          repository: ${{ github.repository }}

      - name: Record testsuite completion
        if: ${{ inputs.build_only == 'false' }}
        working-directory: riscv-gnu-toolchain
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ inputs.test_comment_id }}
          TARGET: ${{ inputs.mode }}-${{ inputs.target }}-${{ inputs.multilib }}
          GCC_HASH: ${{ inputs.baseline_hash }}
          INFO_URL: ${{ inputs.additional_info }}
          TEST_SUCCEEDED: ${{ needs.execute.outputs.test_status == 'success' }}
        run: |
          if [[ "$TEST_SUCCEEDED" == true ]]; then
            state='Complete. Full report will be displayed once all targets are complete'
          else
            state='Testsuite did not complete. See the Actions run for details.'
          fi
          python scripts/update_issue_status.py -token "$GH_TOKEN" -state "$state" -comment "$COMMENT_ID" -target "$TARGET" -check Testsuite -repo "$GITHUB_REPOSITORY" -baseline "$GCC_HASH"
          printf '\n[Additional information](%s)\n' "$INFO_URL" >> comment.md

      - uses: ./.github/actions/update-comment
        if: ${{ inputs.build_only == 'false' }}
        with:
          comment_id: ${{ inputs.test_comment_id }}
          file_path: riscv-gnu-toolchain/comment.md
          token: ${{ github.token }}
