name: "Download Comparison Artifacts"
description: "Collect one testsuite report from the current workflow run"
inputs:
  report-artifact-name:
    required: true
  github-token:
    required: true
  repo:
    required: true

runs:
  using: "composite"
  steps:
    - name: Collect the expected report from this run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ inputs.repo }}
        REPORT_NAME: ${{ inputs.report-artifact-name }}
      run: |
        directory=$(mktemp -d)
        gh api --paginate "repos/$REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
          --jq '.artifacts[] | select(.expired == false and .size_in_bytes <= 268435456) | [.name, .id] | @tsv' > "$directory/artifacts.tsv"
        artifact_id=$(awk -F '\t' -v name="$REPORT_NAME" '$1 == name {print $2; exit}' "$directory/artifacts.tsv")
        if [[ "$artifact_id" =~ ^[0-9]+$ ]]; then
          gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > "$directory/report.zip"
          if python scripts/collect_testsuite_report.py "$directory/report.zip" "$REPORT_NAME" riscv-gnu-toolchain/current_logs; then
            exit 0
          fi
        fi
        mkdir -p riscv-gnu-toolchain/current_logs
        printf '%s|Testsuite report missing or invalid in this run\n' "$REPORT_NAME" >> riscv-gnu-toolchain/current_logs/failed_testsuite.txt
