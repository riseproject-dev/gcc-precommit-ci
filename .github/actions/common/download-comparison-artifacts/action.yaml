name: "Download Comparison Artifacts"
description: "Downloads artifacts needed for run comparison"
inputs:
  report-artifact-name:
    required: true
  binary-artifact-name:
    required: true
  github-token:
    required: true
  repo:
    required: true

runs:
  using: "composite"
  steps:
    - name: Download report from this workflow
      if: ${{ !cancelled() }}
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.report-artifact-name }}
        path: ./riscv-gnu-toolchain/current_logs
      continue-on-error: true

    - name: Download report from another workflow
      if: ${{ !cancelled() && hashFiles(format('./riscv-gnu-toolchain/current_logs/{0}', inputs.report-artifact-name)) == '' }}
      shell: bash
      run: |
        cd riscv-gnu-toolchain
        python ./scripts/download_artifact.py -name ${{ inputs.report-artifact-name }} -repo ${{ inputs.repo }} -token ${{ inputs.github-token }} -outdir current_logs
      continue-on-error: true

    - name: Download rv32 non-multilib binary
      if: ${{ !cancelled() && hashFiles(format('./riscv-gnu-toolchain/current_logs/{0}', inputs.report-artifact-name)) == '' }}
      id: same-workflow-binary
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.binary-artifact-name }}
        path: ./riscv-gnu-toolchain/temp
      continue-on-error: true

    - name: Download binary from another workflow
      if: ${{ !cancelled() && hashFiles(format('./riscv-gnu-toolchain/current_logs/{0}', inputs.report-artifact-name)) == '' && steps.same-workflow-binary.outcome == 'failure' }}
      shell: bash
      run: |
        cd riscv-gnu-toolchain
        python ./scripts/download_artifact.py -name ${{ inputs.binary-artifact-name }} -repo ${{ inputs.repo }} -token ${{ inputs.github-token }} -outdir temp
      continue-on-error: true

    - name: Record missing testsuite report
      if: ${{ !cancelled() && hashFiles(format('./riscv-gnu-toolchain/current_logs/{0}', inputs.report-artifact-name)) == '' }}
      shell: bash
      env:
        REPORT_ARTIFACT_NAME: ${{ inputs.report-artifact-name }}
      run: |
        mkdir -p riscv-gnu-toolchain/current_logs
        printf '%s|Testsuite report artifact could not be downloaded\n' "$REPORT_ARTIFACT_NAME" >> riscv-gnu-toolchain/current_logs/failed_testsuite.txt
